<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI HQD — Trợ lý Giải & Khảo sát Hàm số (Chuẩn SGK)</title>
  <meta name="description" content="AI HQD - Giải đạo hàm, khảo sát, vẽ đồ thị. Chuẩn SGK.">

  <!-- Font đẹp -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS chính -->
  <link rel="stylesheet" href="style.css">

  <!-- Thư viện toán học -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>

  <!-- Thư viện vẽ đồ thị -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <!-- MathJax hiển thị công thức -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body>
  <div class="container">
    <h1>🤖 AI HQD</h1>
    <p class="subtitle">Trợ lý Giải Đạo Hàm & Khảo sát hàm số — Chuẩn SGK</p>

    <!-- ==== KHU VỰC NHẬP DỮ LIỆU ==== -->
    <section class="input-section">
      <h2>📘 Nhập hàm số</h2>

      <label for="expr-input">Biểu thức hàm số:</label>
      <input
        id="expr-input"
        type="text"
        placeholder="Ví dụ: (x^3 - 3x + 2)/(x - 1)"
        autocomplete="off"
      />

      <div class="options">
        <label>Biến:</label>
        <select id="var-input">
          <option value="x">x</option>
          <option value="y">y</option>
        </select>

        <label>Bậc đạo hàm:</label>
        <input
          id="degree-input"
          type="number"
          value="1"
          min="1"
          max="5"
          style="width: 60px"
        />
      </div>

      <div class="buttons">
        <button id="calc-btn">🧮 Tính đạo hàm</button>
        <button id="plot-btn">📈 Vẽ đồ thị</button>
        <button id="clear-btn">❌ Xóa</button>
      </div>

      <p class="tip">
        💡 <b>Mẹo:</b> Dùng <code>^</code> cho lũy thừa, <code>*</code> cho nhân.  
        Ví dụ: <code>(x^3 - 3x + 2)/(x - 1)</code>
      </p>
    </section>

    <!-- ==== KẾT QUẢ ==== -->
    <section class="output-section">
      <h2>📊 Kết quả & Lời giải (Chuẩn SGK)</h2>
      <div id="result-container">
        <em>Kết quả rút gọn sẽ hiển thị tại đây...</em>
      </div>

      <div id="plot-container" style="margin-top: 20px;"></div>
    </section>

    <footer>
      <p>AI HQD kính chào — Giám đốc sản xuất: <b>ANH QUÂN ĐẸP TRAI 😎</b></p>
    </footer>
  </div>

  <!-- ==== THƯ VIỆN TOÁN HỌC ==== -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.24.2.min.js"></script>

  <!-- ==== CẤU HÌNH MATHJAX ==== -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <!-- ==== FILE JS CHÍNH ==== -->
  <script src="script.js"></script>
</body>
