<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI HQD — Trợ lý Giải & Khảo sát Hàm số (Chuẩn SGK)</title>
  <meta name="description" content="AI HQD - Giải đạo hàm, khảo sát, vẽ đồ thị. Chuẩn SGK.">

  <!-- Font đẹp -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS chính -->
  <link rel="stylesheet" href="style.css">

  <!-- Thư viện toán học -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>

  <!-- Thư viện vẽ đồ thị -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <!-- MathJax hiển thị công thức -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body>
  <header class="header">
    <h1>🤖 AI HQD</h1>
    <p>Trợ lý Giải Đạo Hàm & Khảo sát hàm số — Chuẩn SGK</p>
  </header>

  <main class="container">
    <section class="input-section">
      <h2>Nhập hàm số</h2>

      <label>Biểu thức hàm số</label>
      <input id="expression" type="text" placeholder="(x^3 - 3x + 2)/(x - 1)" />

      <div class="controls">
        <label>Biến:</label>
        <select id="variable">
          <option value="x">x</option>
          <option value="y">y</option>
        </select>

        <label>Bậc đạo hàm:</label>
        <select id="order">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>

      <div class="buttons">
        <button id="calcBtn">🧮 Tính đạo hàm</button>
        <button id="plotBtn">📈 Vẽ đồ thị</button>
        <button id="clearBtn">❌ Xóa</button>
      </div>

      <p class="tip">
        💡 Mẹo: Dùng ^ cho lũy thừa, * cho nhân. Ví dụ: (x^3 - 3x + 2)/(x-1)
      </p>
    </section>

    <section class="output-section">
      <h2>Kết quả & Lời giải (Chuẩn SGK)</h2>
      <div id="result"><em>Kết quả rút gọn sẽ hiện ở đây...</em></div>
      <div id="steps"></div>
      <div id="plot" class="plot"></div>
    </section>
  </main>

  <footer class="footer">
    <p>AI HQD kính chào — Giám đốc sản xuất: <strong>ANH QUÂN ĐẸP TRAI</strong> 😎</p>
  </footer>

  <!-- Script chính -->
  <script src="script.js"></script>
</body>
</html>
