<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI HQD - Trợ lý Toán Học</title>
  <link rel="stylesheet" href="style.css">

  <!-- Thư viện cần thiết -->
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async
          src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
  <header class="header">
    <h1>🤖 AL HQD XIN CHÀO</h1>
    <p>Trợ lý Giải & Khảo Sát Hàm Số - Chuẩn SGK</p>
  </header>

  <main class="main-container">
    <section class="input-panel">
      <input type="text" id="expr-input" placeholder="Nhập hàm số, ví dụ: sin(x^2) hoặc (x^3 - 3x + 2)/(x-1)">
      
      <div class="row">
        <label>Biến:</label>
        <input id="var-input" value="x" maxlength="1">
        <label>Bậc đạo hàm:</label>
        <select id="order-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>

      <div class="button-row">
        <button id="calc-btn" class="btn primary">🧮 Tính đạo hàm</button>
        <button id="plot-btn" class="btn gold">📈 Vẽ đồ thị</button>
        <button id="clear-btn" class="btn ghost">🧹 Xóa</button>
      </div>
    </section>

    <section class="output-panel">
      <div class="result-box">
        <h2>Kết quả rút gọn</h2>
        <div id="result-latex" class="math-output">—</div>
      </div>

      <div class="steps-box">
        <h3>Lời giải chi tiết</h3>
        <div id="steps-container">Nhấn "Tính đạo hàm" để xem hướng dẫn chi tiết.</div>
      </div>

      <div class="plot-box">
        <h3>Đồ thị hàm số</h3>
        <div id="plot" class="plot"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    © 2025 — Giám đốc sản xuất: <strong>Anh Quân Đẹp Trai</strong>
  </footer>

  <script src="script.js"></script>
</body>
</html>
